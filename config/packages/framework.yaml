# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    # Files inside the project: var/sessions is a Deployer shared dir, sessions survive deployments.
    session:
        handler_id: session.handler.native_file
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        # Debian PHP disables the session GC (gc_probability=0) and cleans only its own save_path by cron
        gc_probability: 1

    http_client:
        scoped_clients:
            coingecko.client:
                base_uri: 'https://api.coingecko.com/api/v3/'
                timeout: 10
                # The free API is rate limited per minute: wait and retry instead of failing
                retry_failed:
                    http_codes: [429]
                    max_retries: 3
                    delay: 60000
                    multiplier: 1
            fixer.client:
                base_uri: 'https://api.apilayer.com/fixer/'
                timeout: 10
                headers:
                    apikey: '%env(FIXER_API_KEY)%'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        # No real HTTP call in tests: every client answers through http_client.mock_transport
        http_client:
            mock_response_factory: true
        session:
            storage_factory_id: session.storage.factory.mock_file
