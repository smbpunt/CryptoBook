# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    http_client:
        scoped_clients:
            coingecko.client:
                base_uri: 'https://api.coingecko.com/api/v3/'
                timeout: 10
                # The free API is rate limited per minute: wait and retry instead of failing
                retry_failed:
                    http_codes: [429]
                    max_retries: 3
                    delay: 60000
                    multiplier: 1
            fixer.client:
                base_uri: 'https://api.apilayer.com/fixer/'
                timeout: 10
                headers:
                    apikey: '%env(FIXER_API_KEY)%'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
