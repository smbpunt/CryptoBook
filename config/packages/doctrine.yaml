doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            # Keep the existing sequences (AUTO resolved to SEQUENCE on PostgreSQL)
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: sequence
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
            Blockchain:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Blockchain/Entity'
                prefix: 'App\Blockchain\Entity'
            Cryptocurrency:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Cryptocurrency/Entity'
                prefix: 'App\Cryptocurrency\Entity'
            Exchange:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Exchange/Entity'
                prefix: 'App\Exchange\Entity'
            FiatCurrency:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/FiatCurrency/Entity'
                prefix: 'App\FiatCurrency\Entity'
            Deposit:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Deposit/Entity'
                prefix: 'App\Deposit\Entity'
            Loan:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Loan/Entity'
                prefix: 'App\Loan\Entity'
            Nft:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Nft/Entity'
                prefix: 'App\Nft\Entity'
            Position:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Position/Entity'
                prefix: 'App\Position\Entity'
            ProjectMonitoring:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/ProjectMonitoring/Entity'
                prefix: 'App\ProjectMonitoring\Entity'
            Security:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Security/Entity'
                prefix: 'App\Security\Entity'
            StrategyDca:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Strategy/Dca/Entity'
                prefix: 'App\Strategy\Dca\Entity'
            StrategyFarming:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Strategy/Farming/Entity'
                prefix: 'App\Strategy\Farming\Entity'
            StrategyLp:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Strategy/Lp/Entity'
                prefix: 'App\Strategy\Lp\Entity'
            User:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/User/Entity'
                prefix: 'App\User\Entity'
            Wallet:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Wallet/Entity'
                prefix: 'App\Wallet\Entity'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
